[tools]

# Language / Framework
node = ["lts", "24.22.1", "22.23.4", "18"]  # Node.js は偶数 ver. が LTS
"npm:yarn" = "1"  # asdf 由来の ~/.default-npm-packages は非推奨になった
python = ["latest", "3.10", "3.7"]
uv = "latest"
go = ["latest", "1.20"]

# Tool / Service
betterleaks = "1"  # v1 系が Gitleaks 互換
k6 = ["latest", "0.59"]
godot = ["4.7.2-stable"]

# Infrastructure
terraform = ["latest", "1.9", "1.4"]
tflint = "latest"
trivy = "latest"
awscli = "latest"
supabase = "latest"
gh = "latest"

[settings]
python.uv_venv_auto = "source"
