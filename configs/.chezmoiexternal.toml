# ******************************************************************************
# chezmoi 外部リソース定義
# ------------------------------------------------------------------------------
# - git-repo: 指定のリポジトリを `git clone` (既にあれば `git pull`)
# - file:     単一ファイルをダウンロード
# いずれも refreshPeriod の経過まで再取得されず、未指定時は初回のみ取得となる
# ******************************************************************************

# Zsh プラグイン管理
[".zplug"]
type = "git-repo"
url = "https://github.com/zplug/zplug.git"
refreshPeriod = "168h"

# Vim プラグイン管理
[".vim/autoload/plug.vim"]
type = "file"
url = "https://raw.githubusercontent.com/junegunn/vim-plug/master/plug.vim"
refreshPeriod = "168h"
